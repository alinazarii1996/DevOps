---
# Idempotent provisioning + deployment playbook
# Usage:
#   ansible-playbook -i inventory.ini Ansible/Playbook.yml -e image=ghcr.io/USER/devops-api:latest
- name: Prepare host (Docker & basics)
  hosts: all
  become: true
  vars:
    docker_packages:
      - ca-certificates
      - curl
      - gnupg
      - docker-ce
      - docker-ce-cli
      - containerd.io
  tasks:
    - name: Install prerequisites
      apt:
        name: [ca-certificates, curl, gnupg, lsb-release]
        update_cache: true
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repo
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker engine
      apt:
        name: "{{ docker_packages }}"
        update_cache: true
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

- name: Deploy containerized app
  hosts: all
  become: true
  vars:
    container_name: devops-api
    image: "{{ image | default('ghcr.io/OWNER/devops-starter-api:latest') }}"
    env_vars:
      APP_ENV: "ansible"
  tasks:
    - name: Pull image
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull

    - name: Run container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image }}"
        env: "{{ env_vars }}"
        ports:
          - "8000:8000"
        restart_policy: unless-stopped

    - name: Health check
      uri:
        url: http://localhost:8000/healthz
        return_content: true
      register: health
      retries: 20
      delay: 3
      until: health.status == 200
