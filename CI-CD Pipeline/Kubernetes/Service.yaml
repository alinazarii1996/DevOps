apiVersion: v1
kind: Service
metadata:
  name: microservices-service
spec:
  selector:
    app: microservices  # This should match the label of your pod/deployment
  ports:
    - protocol: TCP
      port: 80        # The port on which the service will be exposed
      targetPort: 8080 # The port where your microservices are running in the pod
  type: LoadBalancer  # Use LoadBalancer if you want the service to be exposed externally, or ClusterIP for internal services

